<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Draggable Floating Panel Overlay</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#080C14',
                        cardBg: '#101726',
                        borderColor: '#1E293B',
                        neonGreen: '#00ECB9',
                        neonRed: '#FF3366',
                        neonCyan: '#00F0FF'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080C14; color: #F8FAFC; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        #draggablePanel {
            position: absolute;
            top: 100px;
            left: 100px;
            touch-action: none;
            user-select: none;
            z-index: 100;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 relative overflow-hidden">

    <!-- Background Grid Effect to simulate a trading platform screen -->
    <div class="absolute inset-0 bg-[radial-gradient(#1E293B_1px,transparent_1px)] [background-size:24px_24px] opacity-30 pointer-events-none"></div>

    <div class="text-center mb-8 z-10">
        <h1 class="text-2xl font-black text-white mb-2">Draggable Floating Panel Overlay</h1>
        <p class="text-sm text-slate-400">Click and drag the panel header using mouse or touch to move it anywhere on screen.</p>
        <button onclick="resetPanelPosition()" class="mt-4 bg-borderColor hover:bg-slate-700 text-slate-200 text-xs font-bold px-4 py-2 rounded-xl transition-all">
            Reset Position
        </button>
    </div>

    <!-- Draggable Floating Bot Panel -->
    <div id="draggablePanel" class="w-80 bg-cardBg/95 backdrop-blur-md border border-borderColor rounded-2xl shadow-2xl overflow-hidden">
        
        <!-- Panel Header (Drag Handle) -->
        <div id="panelHeader" class="bg-darkBg/80 border-b border-borderColor px-4 py-3 flex items-center justify-between cursor-grab active:cursor-grabbing">
            <div class="flex items-center space-x-2.5 pointer-events-none">
                <div class="w-6 h-6 rounded-lg bg-neonCyan/20 text-neonCyan flex items-center justify-center text-xs font-bold border border-neonCyan/30">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <span class="font-extrabold text-xs tracking-wide text-white uppercase">AI Signal Bot Overlay</span>
            </div>
            
            <div class="flex items-center space-x-1.5">
                <button onclick="toggleMinimize()" class="w-6 h-6 rounded-lg hover:bg-borderColor text-slate-400 hover:text-white flex items-center justify-center transition-all" title="Minimize">
                    <i class="fa-solid fa-window-minimize text-[10px]" id="minimizeIcon"></i>
                </button>
                <button onclick="closePanel()" class="w-6 h-6 rounded-lg hover:bg-rose-500/20 text-slate-400 hover:text-neonRed flex items-center justify-center transition-all" title="Close">
                    <i class="fa-solid fa-xmark text-xs"></i>
                </button>
            </div>
        </div>

        <!-- Panel Body -->
        <div id="panelBody" class="p-4 space-y-3">
            <div class="flex items-center justify-between bg-darkBg/60 p-2.5 rounded-xl border border-borderColor text-xs">
                <span class="text-slate-400">Status:</span>
                <span class="text-neonGreen font-bold flex items-center">
                    <span class="w-2 h-2 rounded-full bg-neonGreen animate-pulse mr-1.5"></span> Ready & Active
                </span>
            </div>

            <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-xl p-3 text-center">
                <div class="text-[10px] uppercase font-bold text-slate-400">Latest Signal Feed</div>
                <div class="text-base font-black text-neonGreen mt-0.5">EUR/USD - CALL (95%)</div>
                <div class="text-[10px] text-slate-400 mt-0.5">Expiration: 30 Seconds</div>
            </div>

            <div class="grid grid-cols-2 gap-2 pt-1">
                <button onclick="triggerAction('CALL')" class="bg-gradient-to-r from-emerald-500 to-neonGreen text-darkBg font-black py-2.5 rounded-xl text-xs shadow-md hover:opacity-90 transition-all">
                    CALL (BUY)
                </button>
                <button onclick="triggerAction('PUT')" class="bg-gradient-to-r from-rose-600 to-neonRed text-white font-black py-2.5 rounded-xl text-xs shadow-md hover:opacity-90 transition-all">
                    PUT (SELL)
                </button>
            </div>
        </div>
    </div>

    <!-- Reopen Button if closed -->
    <button id="reopenBtn" onclick="reopenPanel()" class="fixed bottom-6 right-6 bg-neonCyan text-darkBg font-extrabold px-4 py-3 rounded-2xl shadow-2xl hidden z-50 flex items-center space-x-2 transition-all hover:scale-105">
        <i class="fa-solid fa-robot"></i>
        <span>Open Bot Overlay</span>
    </button>

    <script>
        const panel = document.getElementById('draggablePanel');
        const header = document.getElementById('panelHeader');

        let isDragging = false;
        let startX, startY, initialX, initialY;

        // Mouse Events
        header.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);

        // Touch Events for Mobile / Tablets
        header.addEventListener('touchstart', dragStart, { passive: false });
        document.addEventListener('touchmove', drag, { passive: false });
        document.addEventListener('touchend', dragEnd);

        function dragStart(e) {
            isDragging = true;
            const clientX = e.type === 'touchstart' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchstart' ? e.touches[0].clientY : e.clientY;

            startX = clientX;
            startY = clientY;

            const rect = panel.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;

            // Prevent text selection during drag
            e.preventDefault();
        }

        function drag(e) {
            if (!isDragging) return;

            const clientX = e.type === 'touchmove' ? e.touches[0].clientX : e.clientX;
            const clientY = e.type === 'touchmove' ? e.touches[0].clientY : e.clientY;

            const dx = clientX - startX;
            const dy = clientY - startY;

            let newX = initialX + dx;
            let newY = initialY + dy;

            // Keep panel within viewport boundaries
            const maxX = window.innerWidth - panel.offsetWidth;
            const maxY = window.innerHeight - panel.offsetHeight;

            newX = Math.max(10, Math.min(newX, maxX - 10));
            newY = Math.max(10, Math.min(newY, maxY - 10));

            panel.style.left = `${newX}px`;
            panel.style.top = `${newY}px`;
            panel.style.position = 'fixed';
        }

        function dragEnd() {
            isDragging = false;
        }

        function resetPanelPosition() {
            panel.style.left = '100px';
            panel.style.top = '100px';
            panel.style.position = 'absolute';
        }

        function toggleMinimize() {
            const body = document.getElementById('panelBody');
            const icon = document.getElementById('minimizeIcon');
            if (body.style.display === 'none') {
                body.style.display = 'block';
                icon.className = 'fa-solid fa-window-minimize text-[10px]';
            } else {
                body.style.display = 'none';
                icon.className = 'fa-solid fa-window-maximize text-[10px]';
            }
        }

        function closePanel() {
            panel.style.display = 'none';
            document.getElementById('reopenBtn').classList.remove('hidden');
        }

        function reopenPanel() {
            panel.style.display = 'block';
            document.getElementById('reopenBtn').classList.add('hidden');
        }

        function triggerAction(type) {
            alert(`Simulated order executed: ${type}`);
        }
    </script>
</body>
</html>
